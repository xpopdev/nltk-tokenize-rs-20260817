[package]
name = "ported_lib"
version = "0.1.0"
edition = "2021"

[lib]
# cdylib -> importable Python extension module; rlib -> also usable as a
# normal Rust crate (needed for `cargo test` on the pure-Rust core).
crate-type = ["cdylib", "rlib"]
name = "ported_lib"

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
regex = "1.10"
fancy-regex = { version = "0.13", optional = true }
rayon = "1.10"
wgpu = { version = "24", optional = true }
bytemuck = { version = "1", optional = true }
pollster = { version = "0.3", optional = true }
memchr = "2.8.3"
aho-corasick = "1.1.5"

[features]
default = []
punkt-fancy = ["fancy-regex"]
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]

[dev-dependencies]
# Property-based testing pairs well with the matrix-testing approach on
# the Rust side, in addition to the Python-level differential tests.
proptest = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
