name: gutenberg-bench
on: workflow_dispatch
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install maturin nltk
      - run: python -c "import nltk; nltk.download('punkt_tab', quiet=True); nltk.download('punkt', quiet=True); nltk.download('gutenberg', quiet=True)"
      - run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin nltk
          maturin develop --release
          PORTED_LIB_PUNKT_BRIDGE=1 python scripts/gutenberg_bench.py 2>&1 | tee gutenberg_report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: gutenberg-report, path: gutenberg_report.txt }
