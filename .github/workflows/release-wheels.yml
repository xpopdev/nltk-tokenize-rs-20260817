name: release-wheels

# Builds installable wheels for Linux/macOS/Windows across the supported
# Python versions. Separate from rust-build-test.yml (which is the
# correctness/matrix gate) because this is a packaging concern that only
# needs to run when you're actually about to ship a release, not on every
# push.
#
# Trigger: push a tag like `v0.1.0`, or run manually.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.os == 'macos-latest' && 'universal2-apple-darwin' || '' }}
          args: --release --out dist
          sccache: "true"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  # Optional: uncomment to publish to PyPI on tagged releases once
  # PYPI_API_TOKEN is set as a repo secret. Left disabled by default so a
  # tag push doesn't accidentally publish before you're ready.
