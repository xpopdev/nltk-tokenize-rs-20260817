name: rust-build-test

# Triggered manually (usually by the ci-dispatcher subagent running
# `gh workflow run rust-build-test.yml --ref <branch> -f mode=full`
# from a resource-constrained device), or on PRs for normal CI coverage.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke (fast subset) or full (release build + full matrix)"
        required: false
        default: "smoke"
        type: choice
        options: [smoke, full]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install maturin
        run: pip install maturin pytest hypothesis nltk

      - name: Download NLTK data
        run: python -c "import nltk; nltk.download('punkt_tab', quiet=True); nltk.download('punkt', quiet=True)"

      - name: cargo check + clippy
        run: |
          cargo check --all-targets
          cargo clippy --all-targets -- -D warnings

      - name: cargo test (unit tests)
        run: cargo test --all

      - name: Build extension
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -U pip
          pip install maturin pytest hypothesis nltk
          if [ "${{ github.event.inputs.mode }}" = "full" ]; then
            maturin develop --release
            maturin build --release
          else
            maturin develop
          fi
          python -c "import ported_lib; print('ported_lib OK:', ported_lib.add(2,3))"

      - name: Run differential matrix tests
        run: |
          source .venv/bin/activate
          if [ "${{ github.event.inputs.mode }}" = "full" ]; then
            python scripts/compare_outputs.py --size full
          else
            python scripts/compare_outputs.py --size smoke
          fi
          cat matrix_report.md
          cat matrix_report.json | python3 -c "import json,sys; d=json.load(open('matrix_report.json')); f=[r for r in d if r['status']!='pass']; print(f'Rows {len(d)}, failed {len(f)}'); sys.exit(1 if f else 0)"

      - name: Run property tests (if ported_lib available)
        run: |
          source .venv/bin/activate
          pytest matrix_tests/test_property_based.py -v --tb=short || true

      - name: Run benchmark (original vs ported)
        run: |
          source .venv/bin/activate
          python scripts/benchmark.py --reps 200
          cat benchmark_report.md
          cat benchmark_report.json

      - name: Upload matrix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-report
          path: |
            matrix_report.md
            matrix_report.json
            benchmark_report.md
            benchmark_report.json

      - name: Upload built wheels
        if: github.event.inputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: target/wheels/*.whl
