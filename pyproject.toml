[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "ported-lib"
version = "0.1.0"
description = "Rust-backed drop-in for nltk.tokenize (NLTK 3.9.2) — word_tokenize/sent_tokenize + full tokenizer family"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["nltk", "tokenize", "rust", "pyo3", "nlp"]
dependencies = ["nltk>=3.9"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "nltk"]

[tool.maturin]
module-name = "ported_lib"
features = ["pyo3/extension-module"]
bindings = "pyo3"
