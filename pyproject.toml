[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "ported-lib"
version = "0.1.0"
description = "Rust-backed drop-in replacement, generated by the rust-port-kit pipeline"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest", "hypothesis"]

[tool.maturin]
# Keep the Python-facing module name matching the original library so
# call sites don't need to change import paths.
module-name = "ported_lib"
features = ["pyo3/extension-module"]
